<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Mis Notas - IE Tupac Amaru II</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/estudiante.css}" />
</head>
<body>

    <div class="chevron-strip"></div>
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">TA</div>
            <div class="brand-text">Aula Túpac Amaru<small>Educación Básica Regular</small></div>
        </div>
        <div class="nav-group-label">General</div>
        <a class="nav-link" th:href="@{/estudiante/dashboard}"><i class="fas fa-home"></i> Inicio</a>
        <a class="nav-link" th:href="@{/estudiante/mis-cursos}"><i class="fas fa-book"></i> Mis Cursos</a>
        <div class="nav-group-label">Académico</div>
        <a class="nav-link" th:href="@{/estudiante/evaluaciones}"><i class="fas fa-edit"></i> Evaluaciones</a>
        <a class="nav-link active" th:href="@{/estudiante/evaluaciones/mis-notas}"><i class="fas fa-file-alt"></i> Notas</a>
    </nav>

    <div class="main-content">
        <header class="topbar">
            <div>
                <button class="toggle-sidebar" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
                <span class="title">Mi Historial de Notas</span>
            </div>
            <div class="user-info">
                <span class="role-pill">ESTUDIANTE</span>
                <div class="avatar" th:text="${#strings.substring(usuarioEstudiante.nombre, 0, 1) + #strings.substring(usuarioEstudiante.apellido, 0, 1)}">CL</div>
                <form th:action="@{/logout}" method="post" class="ms-2 mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-sign-out-alt"></i> Salir</button>
                </form>
            </div>
        </header>

        <div class="content">
            <div class="panel">
                <h3><i class="fas fa-clipboard-check me-2" style="color: var(--gold);"></i>Mis Calificaciones</h3>
                
                <div class="alert alert-info mt-3" th:if="${misNotas.isEmpty()}">
                    Aún no has rendido ninguna evaluación.
                </div>

                <div class="table-responsive mt-3" th:unless="${misNotas.isEmpty()}">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Evaluación</th>
                                <th>Curso</th>
                                <th>Fecha de Envío</th>
                                <th>Nota Obtenida</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="nota : ${misNotas}">
                                <td><strong th:text="${nota.evaluacion.titulo}"></strong></td>
                                <td th:text="${nota.evaluacion.curso.titulo}"></td>
                                <td th:text="${#temporals.format(nota.fechaInicio, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <span class="badge bg-success fs-6" th:text="${nota.notaObtenida} + ' pts'"></span>
                                </td>
                                <td>
                                    <span class="badge bg-primary" th:if="${nota.completado}">Completado</span>
                                    <span class="badge bg-warning text-dark" th:unless="${nota.completado}">En Progreso</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
