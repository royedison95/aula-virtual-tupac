<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Rendir Evaluación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/estudiante.css}" />
</head>
<body>

    <div class="chevron-strip"></div>

    <div class="main-content" style="margin-left: 0; padding: 20px; background: var(--paper); min-height: 100vh;">
        <div class="container" style="max-width: 800px;">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3><i class="fas fa-file-signature" style="color: var(--brick);"></i> <span th:text="${evaluacion.titulo}"></span></h3>
                <a th:href="@{/estudiante/evaluaciones}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
            </div>

            <form th:action="@{/estudiante/evaluaciones/calificar/{id}(id=${evaluacion.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- BUCLE DE PREGUNTAS -->
                <div class="card mb-3 shadow-sm" th:each="preg, iter : ${preguntas}">
                    <div class="card-body">
                        <h5 class="card-title">
                            <span th:text="${iter.index + 1} + '. '"></span>
                            <span th:text="${preg.enunciado}"></span>
                        </h5>
                        
                        <div class="mt-3">
                            <div class="form-check mb-2" th:each="op : ${preg.opciones}">
                                <!-- El name es único por pregunta (pregunta_ID) para que no se mezclen -->
                                <input class="form-check-input" type="radio" 
                                       th:name="'pregunta_' + ${preg.id}" 
                                       th:id="'op_' + ${op.id}" 
                                       th:value="${op.id}" required>
                                <label class="form-check-label" th:for="'op_' + ${op.id}" th:text="${op.texto}"></label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="alert alert-info" th:if="${preguntas.isEmpty()}">
                    Esta evaluación aún no tiene preguntas.
                </div>

                <!-- BOTÓN DE ENVIAR -->
                <div class="text-end mb-5" th:unless="${preguntas.isEmpty()}">
                    <button type="submit" class="btn btn-lg btn-success" onclick="return confirm('¿Estás seguro de enviar tu examen?')">
                        <i class="fas fa-paper-plane"></i> Enviar Examen
                    </button>
                </div>
            </form>

        </div>
    </div>
</body>
</html>
