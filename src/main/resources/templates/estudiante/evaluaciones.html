<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Mis Evaluaciones - IE Tupac Amaru II</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/estudiante.css}" />
</head>
<body>

    <div class="chevron-strip"></div>
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">TA</div>
            <div class="brand-text">Aula Túpac Amaru<small>Educación Básica Regular</small></div>
        </div>
        <div class="nav-group-label">General</div>
        <a class="nav-link" th:href="@{/estudiante/dashboard}"><i class="fas fa-home"></i> Inicio</a>
        <a class="nav-link" th:href="@{/estudiante/mis-cursos}"><i class="fas fa-book"></i> Mis Cursos</a>
        <div class="nav-group-label">Académico</div>
        <a class="nav-link active" th:href="@{/estudiante/evaluaciones}"><i class="fas fa-edit"></i> Evaluaciones</a>
    </nav>

    <div class="main-content">
        <header class="topbar">
            <div>
                <button class="toggle-sidebar" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
                <span class="title">Mis Evaluaciones</span>
            </div>
            <div class="user-info">
                <span class="role-pill">ESTUDIANTE</span>
                <div class="avatar" th:text="${#strings.substring(usuarioEstudiante.nombre, 0, 1) + #strings.substring(usuarioEstudiante.apellido, 0, 1)}">CL</div>
                <form th:action="@{/logout}" method="post" class="ms-2 mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-sign-out-alt"></i> Salir</button>
                </form>
            </div>
        </header>

        <div class="content">
            <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

            <div class="panel">
                <h3><i class="fas fa-file-alt me-2" style="color: var(--gold);"></i>Evaluaciones Disponibles</h3>
                
                <div class="alert alert-info mt-3" th:if="${evaluaciones.isEmpty()}">
                    No hay evaluaciones pendientes en tus cursos.
                </div>

                <div class="table-responsive mt-3" th:unless="${evaluaciones.isEmpty()}">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Evaluación</th>
                                <th>Curso</th>
                                <th>Tipo</th>
                                <th>Puntaje Máx.</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ev : ${evaluaciones}">
                                <td><strong th:text="${ev.titulo}"></strong></td>
                                <td th:text="${ev.curso.titulo}"></td>
                                <td><span class="badge bg-info text-dark" th:text="${ev.tipo}"></span></td>
                                <td th:text="${ev.puntajeMaximo} + ' pts'"></td>
                                <td>
                                    <a th:href="@{/estudiante/evaluaciones/rendir/{id}(id=${ev.id})}" class="btn btn-sm" style="background: var(--brick); color: white;">
                                        <i class="fas fa-play"></i> Rendir Examen
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
