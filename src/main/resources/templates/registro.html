<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - IE Tupac Amaru II</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

    <div class="chevron-strip"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg p-4" style="border-radius: 16px;">

                    <h2 class="text-center mb-3">Registro de Usuario</h2>
                    <p class="text-center text-muted mb-4">Completa tus datos para registrarte</p>

                    <!-- ALERTA DE ERROR -->
                    <div class="alert alert-danger" th:if="${error}" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- FORMULARIO -->
                    <form th:action="@{/registro}" th:object="${usuario}" method="post">

                        <!-- DNI -->
                        <div class="mb-3">
                            <label class="form-label">DNI *</label>
                            <input type="text" th:field="*{dni}" class="form-control"
                                   placeholder="Ej: 12345678" maxlength="8" required>
                        </div>

                        <!-- NOMBRES -->
                        <div class="mb-3">
                            <label class="form-label">Nombres *</label>
                            <input type="text" th:field="*{nombre}" class="form-control"
                                   placeholder="Ej: Juan" required>
                        </div>

                        <!-- APELLIDOS -->
                        <div class="mb-3">
                            <label class="form-label">Apellidos *</label>
                            <input type="text" th:field="*{apellido}" class="form-control"
                                   placeholder="Ej: Pérez" required>
                        </div>

                        <!-- CÓDIGO DE USUARIO -->
                        <div class="mb-3">
                            <label class="form-label">Código de Usuario *</label>
                            <input type="text" th:field="*{codigoUsuario}" class="form-control"
                                   placeholder="Ej: USR-001" required>
                        </div>

                        <!-- EMAIL -->
                        <div class="mb-3">
                            <label class="form-label">Correo *</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   placeholder="Ej: juan@tupacamaru.edu.pe" required>
                        </div>

                        <!-- CONTRASEÑA -->
                        <div class="mb-3">
                            <label class="form-label">Contraseña *</label>
                            <input type="password" th:field="*{password}" class="form-control"
                                   placeholder="••••••••" required>
                        </div>

                        <!--  PERFIL (4 OPCIONES) -->
                        <div class="mb-3">
                            <label class="form-label">Perfil *</label>
                            <select th:field="*{rol}" class="form-select" required>
                                <option value="">-- Seleccionar perfil --</option>
                                <option value="ADMIN">👨‍💼 Administrador</option>
                                <option value="PROFESOR">👨‍🏫 Docente</option>
                                <option value="ESTUDIANTE">🎓 Alumno</option>
                                <option value="APODERADO">👨‍👩‍👦 Apoderado</option>
                            </select>
                        </div>

                        <!-- TELÉFONO (opcional) -->
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" th:field="*{telefono}" class="form-control"
                                   placeholder="Opcional">
                        </div>

                        <!-- DIRECCIÓN (opcional) -->
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" th:field="*{direccion}" class="form-control"
                                   placeholder="Opcional">
                        </div>

                        <!-- BOTÓN -->
                        <button type="submit" class="btn btn-success w-100 mb-3">
                            <i class="fas fa-user-plus me-2"></i> Registrarse
                        </button>

                    </form>

                    <!-- VOLVER AL LOGIN -->
                    <div class="text-center">
                        <a th:href="@{/login}" class="text-decoration-none">
                            <i class="fas fa-arrow-left me-1"></i> Volver al login
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
