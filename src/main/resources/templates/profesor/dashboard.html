<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Panel del Docente - IE Tupac Amaru II</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/estudiante.css}" />
</head>
<body>

    <div class="chevron-strip"></div>
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">TA</div>
            <div class="brand-text">Aula Túpac Amaru<small>Educación Básica Regular</small></div>
        </div>
        <div class="nav-group-label">General</div>
        <a class="nav-link active" th:href="@{/profesor/dashboard}"><i class="fas fa-home"></i> Mis Cursos</a>
        <div class="sidebar-foot">... Java 21 · Spring Boot</div>
    </nav>

    <div class="main-content">
        <header class="topbar">
            <div>
                <button class="toggle-sidebar" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
                <span class="title">Panel del Docente</span>
            </div>
            <div class="user-info">
                <span class="role-pill">PROFESOR</span>
                <div class="avatar" th:text="${#strings.substring(usuarioProfesor.nombre, 0, 1) + #strings.substring(usuarioProfesor.apellido, 0, 1)}">RP</div>
                <form th:action="@{/logout}" method="post" class="ms-2 mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-sign-out-alt"></i> Salir</button>
                </form>
            </div>
        </header>

        <div class="content">
            <h3 class="mb-4">Hola, <span th:text="${usuarioProfesor.nombre}"></span> 👨‍🏫</h3>
            
            <div class="panel">
                <h4 class="mb-3"><i class="fas fa-book me-2" style="color: var(--gold);"></i>Areas  Asignados</h4>
                
                <div class="course-grid" th:if="${!misCursos.isEmpty()}">
                    <div class="course-card" th:each="curso : ${misCursos}">
                        <div class="thumb"><i class="fas fa-book"></i></div>
                        <div class="body">
                            <div class="cat" th:text="${curso.areaCurricular}">Área</div>
                            <h4 th:text="${curso.titulo}">Título</h4>
                            <a th:href="@{/profesor/curso/{id}/lecciones(id=${curso.id})}" class="btn btn-sm w-100 mt-2" style="background: var(--brick); color: white;">
                                Gestionar Lecciones <i class="fas fa-plus ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
                
                <div class="alert alert-info" th:if="${misCursos.isEmpty()}">
                    No tienes cursos asignados aún.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
