<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Preguntas de Evaluación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/estudiante.css}" />
</head>
<body>

    <div class="chevron-strip"></div>
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">TA</div>
            <div class="brand-text">Aula Túpac Amaru<small>Educación Básica Regular</small></div>
        </div>
        <div class="nav-group-label">General</div>
        <a class="nav-link" th:href="@{/profesor/dashboard}"><i class="fas fa-home"></i> Mis Cursos</a>
    </nav>

    <div class="main-content">
        <header class="topbar">
            <div>
                <button class="toggle-sidebar" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
                <span class="title">Preguntas de: <span th:text="${evaluacion.titulo}" style="color: var(--brick);"></span></span>
            </div>
            <div class="user-info">
                <span class="role-pill">PROFESOR</span>
                <form th:action="@{/logout}" method="post" class="ms-2 mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-sign-out-alt"></i> Salir</button>
                </form>
            </div>
        </header>

        <div class="content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3>Banco de Preguntas</h3>
                <a th:href="@{/profesor/evaluaciones/curso/{id}(id=${curso.id})}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver a Evaluaciones</a>
            </div>

            <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

            <div class="row">
                <!-- FORMULARIO PARA NUEVA PREGUNTA -->
                <div class="col-md-5">
                    <div class="panel">
                        <h4 class="mb-3">Agregar Pregunta</h4>
                        <form th:action="@{/profesor/evaluaciones/{id}/preguntas/guardar(id=${evaluacion.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            
                            <div class="mb-2">
                                <label>Pregunta (Enunciado)</label>
                                <textarea name="enunciado" class="form-control" rows="2" required placeholder="¿Marca la opción correcta?"></textarea>
                            </div>
                            <div class="mb-2">
                                <label class="text-success"><i class="fas fa-check-circle"></i> Respuesta Correcta</label>
                                <input type="text" name="respuestaCorrecta" class="form-control" required>
                            </div>
                            <div class="mb-2">
                                <label class="text-danger"><i class="fas fa-times-circle"></i> Opción Incorrecta 1</label>
                                <input type="text" name="incorrecta1" class="form-control" required>
                            </div>
                            <div class="mb-2">
                                <label class="text-danger"><i class="fas fa-times-circle"></i> Opción Incorrecta 2</label>
                                <input type="text" name="incorrecta2" class="form-control" required>
                            </div>
                            <div class="mb-2">
                                <label class="text-danger"><i class="fas fa-times-circle"></i> Opción Incorrecta 3</label>
                                <input type="text" name="incorrecta3" class="form-control" required>
                            </div>
                            
                            <button type="submit" class="btn w-100 text-white mt-3" style="background: var(--green);">
                                <i class="fas fa-plus"></i> Guardar Pregunta
                            </button>
                        </form>
                    </div>
                </div>

                <!-- LISTA DE PREGUNTAS -->
                <div class="col-md-7">
                    <div class="panel">
                        <h4 class="mb-3">Preguntas Creadas</h4>
                        <div class="alert alert-warning" th:if="${preguntas.isEmpty()}">Aún no hay preguntas en esta evaluación.</div>
                        
                        <div class="card mb-3" th:each="preg, iter : ${preguntas}">
                            <div class="card-body">
                                <h5 class="card-title"><span th:text="${iter.index + 1} + '. '"></span><span th:text="${preg.enunciado}"></span></h5>
                                <ul class="list-group mt-2">
                                    <li th:each="op : ${preg.opciones}" class="list-group-item" 
                                        th:classappend="${op.esCorrecta} ? 'list-group-item-success' : ''">
                                        <span th:if="${op.esCorrecta}" class="badge bg-success me-2">Correcta</span>
                                        <span th:unless="${op.esCorrecta}" class="badge bg-secondary me-2">Opción</span>
                                        <span th:text="${op.texto}"></span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
