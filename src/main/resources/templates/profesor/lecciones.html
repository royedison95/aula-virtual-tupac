<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Gestionar Lecciones - IE Tupac Amaru II</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/estudiante.css}" />
</head>
<body>

    <div class="chevron-strip"></div>

    <!-- SIDEBAR DEL PROFESOR -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">TA</div>
            <div class="brand-text">
                Aula Túpac Amaru
                <small>Educación Básica Regular · Colegio privado</small>
            </div>
        </div>
        <div class="nav-group-label">General</div>
        <a class="nav-link" th:href="@{/profesor/dashboard}">
            <i class="fas fa-home"></i> Mis Cursos
        </a>
        <div class="sidebar-foot">
            <i class="fas fa-circle text-success me-1" style="font-size: 8px;"></i>
            Java 21 · Spring Boot 4.1.1
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header class="topbar">
            <div>
                <button class="toggle-sidebar" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="title">
                    Lecciones: <span th:text="${curso.titulo}" style="color: var(--brick);"></span>
                </span>
            </div>
            <div class="user-info">
                <span class="role-pill">PROFESOR</span>
                <form th:action="@{/logout}" method="post" class="ms-2 mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="fas fa-sign-out-alt"></i> Salir
                    </button>
                </form>
            </div>
        </header>

        <div class="content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3>Lecciones de: <span th:text="${curso.titulo}" style="color: var(--brick);"></span></h3>
                <a th:href="@{/profesor/dashboard}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver</a>
            </div>

            <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

            <div class="row">
                <!-- FORMULARIO PARA SUBIR LECCIÓN -->
                <div class="col-md-5">
                    <div class="panel">
                        <h4 class="mb-3">Subir Nueva Lección</h4>
                        <form th:action="@{/profesor/curso/{id}/lecciones/guardar(id=${curso.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            
                            <div class="mb-2">
                                <label>Título</label>
                                <input type="text" name="titulo" class="form-control" required>
                            </div>
                            <div class="mb-2">
                                <label>Descripción</label>
                                <textarea name="descripcion" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="mb-2">
                                <label>URL del Video (YouTube embed)</label>
                                <input type="url" name="videoUrl" class="form-control" placeholder="https://www.youtube.com/embed/...">
                            </div>
                            <div class="mb-2">
                                <label>URL del PDF</label>
                                <input type="url" name="archivoPdfUrl" class="form-control" placeholder="https://ejemplo.com/archivo.pdf">
                            </div>
                            <div class="row">
                                <div class="col-6 mb-2">
                                    <label>Orden</label>
                                    <input type="number" name="orden" class="form-control" value="1" required>
                                </div>
                                <div class="col-6 mb-2">
                                    <label>Duración (min)</label>
                                    <input type="number" name="duracionMinutos" class="form-control" value="10" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn w-100 text-white mt-2" style="background: var(--green);">
                                <i class="fas fa-upload"></i> Guardar Lección
                            </button>
                        </form>
                    </div>
                </div>

                <!-- LISTA DE LECCIONES -->
                <div class="col-md-7">
                    <div class="panel">
                        <h4 class="mb-3">Lecciones Publicadas</h4>
                        <ul class="list-group">
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="lec, iter : ${lecciones}">
                                <div>
                                    <strong th:text="${'L' + (iter.index + 1) + ' - ' + lec.titulo}"></strong>
                                    <br>
                                    <small class="text-muted" th:text="${lec.duracionMinutos} + ' min'"></small>
                                </div>
                                <span class="badge bg-success">Publicada</span>
                            </li>
                        </ul>
                        <div class="alert alert-warning mt-3" th:if="${lecciones.isEmpty()}">
                            Aún no has subido lecciones para este curso.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.sidebar .nav-link').forEach(link => {
            link.addEventListener('click', function() {
                if (window.innerWidth < 992) {
                    document.getElementById('sidebar').classList.remove('open');
                }
            });
        });
    </script>
</body>
</html>
