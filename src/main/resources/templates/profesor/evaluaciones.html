<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Evaluaciones - IE Tupac Amaru II</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/estudiante.css}" />
</head>
<body>

    <div class="chevron-strip"></div>

    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">TA</div>
            <div class="brand-text">Aula Túpac Amaru<small>Educación Básica Regular</small></div>
        </div>
        <div class="nav-group-label">General</div>
        <a class="nav-link" th:href="@{/profesor/dashboard}"><i class="fas fa-home"></i> Mis Cursos</a>
        <div class="sidebar-foot">... Java 21 · Spring Boot</div>
    </nav>

    <div class="main-content">
        <header class="topbar">
            <div>
                <button class="toggle-sidebar" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
                <span class="title">Evaluaciones: <span th:text="${curso.titulo}" style="color: var(--brick);"></span></span>
            </div>
            <div class="user-info">
                <span class="role-pill">PROFESOR</span>
                <form th:action="@{/logout}" method="post" class="ms-2 mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-sign-out-alt"></i> Salir</button>
                </form>
            </div>
        </header>

        <div class="content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3>Gestión de Evaluaciones</h3>
                <div class="d-flex gap-2">
                    <a th:href="@{/profesor/dashboard}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver</a>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevaEvaluacion">
                        <i class="fas fa-plus"></i> Nueva Evaluación
                    </button>
                </div>
            </div>

            <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

            <!-- TABLA DE EVALUACIONES -->
            <div class="panel">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Título</th>
                            <th>Tipo</th>
                            <th>Puntaje Máx.</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${evaluaciones.isEmpty()}">
                            <td colspan="5" class="text-center text-muted py-4">No hay evaluaciones creadas aún.</td>
                        </tr>
                        <tr th:each="ev : ${evaluaciones}">
                            <td><strong th:text="${ev.titulo}"></strong></td>
                            <td><span class="badge bg-info text-dark" th:text="${ev.tipo}"></span></td>
                            <td th:text="${ev.puntajeMaximo} + ' pts'"></td>
                            <td>
                                <span class="badge bg-success" th:if="${ev.estado}">Activa</span>
                                <span class="badge bg-secondary" th:unless="${ev.estado}">Inactiva</span>
                            </td>
                            <td>
                                <!-- Botón para agregar preguntas (Fase 2) -->
                                <a th:href="@{/profesor/evaluaciones/{idEv}/preguntas(idCurso=${curso.id}, idEv=${ev.id})}" class="btn btn-sm btn-warning">
                                    <i class="fas fa-list"></i> Preguntas
                                </a>
                                
                                <!-- Botón Eliminar -->
                                <form th:action="@{/profesor/evaluaciones/eliminar/{idCurso}/{idEv}(idCurso=${curso.id}, idEv=${ev.id})}" method="post" style="display:inline-block;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar evaluación?')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL: NUEVA EVALUACIÓN -->
    <div class="modal fade" id="modalNuevaEvaluacion" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Crear Nueva Evaluación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/profesor/evaluaciones/guardar/{id}(id=${curso.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="modal-body">
                        <div class="mb-3">
                            <label>Título de la Evaluación</label>
                            <input type="text" name="titulo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Descripción</label>
                            <textarea name="descripcion" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label>Tipo</label>
                            <select name="tipo" class="form-select" required>
                                <option value="EXAMEN">Examen</option>
                                <option value="CUESTIONARIO">Cuestionario</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label>Puntaje Máximo</label>
                                <input type="number" name="puntajeMaximo" class="form-control" value="20" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label>Intentos Permitidos</label>
                                <input type="number" name="intentosPermitidos" class="form-control" value="1" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Evaluación</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
