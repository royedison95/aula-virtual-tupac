<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario - IE Tupac Amaru II</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/administrador.css}" />
</head>

<body>

    <div class="chevron-strip"></div>

    <!-- ===== SIDEBAR (COPIADO) ===== -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">TA</div>
            <div class="brand-text">
                Aula Túpac Amaru
                <small>Educación Básica Regular · Colegio privado</small>
            </div>
        </div>

        <div class="nav-group-label">General</div>
        <a class="nav-link" th:href="@{/admin/dashboard}">
            <i class="fas fa-chart-pie"></i> Dashboard
        </a>
        <a class="nav-link" th:href="@{/admin/cursos}">
            <i class="fas fa-book"></i> Cursos
            <span class="badge-nav">12</span>
        </a>
        <a class="nav-link active" th:href="@{/admin/usuarios}">
            <i class="fas fa-users"></i> Usuarios
            <span class="badge-nav">286</span>
        </a>
        <a class="nav-link" th:href="@{/admin/profesores}">
            <i class="fas fa-chalkboard-teacher"></i> Profesores
            <span class="badge-nav">47</span>
        </a>
        <a class="nav-link" th:href="@{/admin/matriculas}">
            <i class="fas fa-address-card"></i> Matrículas
        </a>

        <div class="nav-group-label">Gestión</div>
        <a class="nav-link" th:href="@{/admin/evaluaciones}">
            <i class="fas fa-calendar-alt"></i> Evaluaciones
        </a>
        <a class="nav-link" th:href="@{/admin/reportes}">
            <i class="fas fa-file-alt"></i> Reportes
        </a>

        <div class="nav-group-label">Integración MINEDU</div>
        <a class="nav-link siagie" th:href="@{/admin/siagie}">
            <i class="fas fa-cloud-upload-alt"></i> SIAGIE
            <span class="badge-nav">⚠️</span>
        </a>

        <div class="sidebar-foot">
            <i class="fas fa-circle text-success me-1" style="font-size: 8px;"></i>
            Java 17 · Spring Boot 3 · MySQL 8
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">

        <!-- ===== TOPBAR (COPIADO) ===== -->
        <header class="topbar">
            <div>
                <button class="toggle-sidebar" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="title" th:text="${usuario.id != null ? 'Editar Usuario' : 'Nuevo Usuario'}">Formulario Usuario</span>
            </div>
            <div class="user-info">
                <span class="role-pill">ADMIN</span>
                <div class="avatar">MV</div>
                <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger ms-2">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </a>
            </div>
        </header>

        <!-- ===== CONTENIDO ===== -->
        <div class="content">

            <div class="panel">
                <h3 th:text="${usuario.id != null ? 'Editar Usuario' : 'Nuevo Usuario'}"></h3>

                  <!--  ALERTA DE ERROR -->
                    <div class="alert alert-danger" th:if="${error}" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                <form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post">

                    <input type="hidden" th:field="*{id}">
                        <!--  CÓDIGO DE USUARIO (EDITABLE) -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Código de Usuario</label>
                                <input type="text" th:field="*{codigoUsuario}" class="form-control"
                                    placeholder="Escribe el código: ADMIN-01, PROF-001, EST-001...">
                            </div>
                        </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Apellido</label>
                            <input type="text" th:field="*{apellido}" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" th:field="*{password}" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" th:field="*{telefono}" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" th:field="*{direccion}" class="form-control">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Rol</label>
                             <select th:field="*{rol}" class="form-select" required>
                                <option value="">-- Seleccionar rol --</option>
                                <option th:each="r : ${roles}"
                                        th:value="${r.nombre}"
                                        th:text="${r.nombre + ' - ' + r.descripcion}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Estado</label>
                            <select th:field="*{estado}" class="form-select">
                                <option th:value="true">Activo</option>
                                <option th:value="false">Inactivo</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                    <a th:href="@{/admin/usuarios}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>

                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.querySelectorAll('.sidebar .nav-link').forEach(link => {
            link.addEventListener('click', function() {
                if (window.innerWidth < 992) {
                    document.getElementById('sidebar').classList.remove('open');
                }
            });
        });
    </script>

</body>
</html>
