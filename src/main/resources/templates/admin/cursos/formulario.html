<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Curso - IE Tupac Amaru II</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/gestioncursos.css}">
</head>

<body>

    <div class="chevron-strip"></div>

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">TA</div>
            <div class="brand-text">
                Aula Túpac Amaru
                <small>Educación Básica Regular · Colegio privado</small>
            </div>
        </div>
        <div class="nav-group-label">General</div>
        <a class="nav-link" th:href="@{/admin/dashboard}"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a class="nav-link active" th:href="@{/admin/cursos}"><i class="fas fa-book"></i> Cursos</a>
        <a class="nav-link" th:href="@{/admin/usuarios}"><i class="fas fa-user-graduate"></i> Usuarios</a>
        <a class="nav-link" th:href="@{/admin/profesores}"><i class="fas fa-chalkboard-teacher"></i> Profesores</a>
        <a class="nav-link" th:href="@{/admin/matriculas}"><i class="fas fa-address-card"></i> Matrículas</a>
        <div class="nav-group-label">Gestión</div>
        <a class="nav-link" th:href="@{/admin/evaluaciones}"><i class="fas fa-calendar-alt"></i> Evaluaciones</a>
        <a class="nav-link" th:href="@{/admin/reportes}"><i class="fas fa-file-alt"></i> Reportes</a>
        <div class="nav-group-label">Integración MINEDU</div>
        <a class="nav-link siagie" th:href="@{/admin/siagie}"><i class="fas fa-cloud-upload-alt"></i> SIAGIE <span class="badge-nav">⚠️</span></a>
        <div class="sidebar-foot">
            <i class="fas fa-circle text-success me-1" style="font-size: 8px;"></i>
            Java 21 · Spring Boot 4.1.1 · MySQL 8
        </div>
    </nav>

    <div class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">
            <div>
                <button class="toggle-sidebar" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="title" th:text="${curso.id != null ? 'Editar Curso' : 'Nuevo Curso'}">Formulario</span>
            </div>
            <div class="user-info">
                <span class="role-pill">ADMIN</span>
                <div class="avatar">MV</div>
                <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger ms-2">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </a>
            </div>
        </header>

        <div class="content">

            <div class="modal-content" style="max-width: 800px; margin: 0 auto;">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="${curso.id != null ? 'Editar Curso' : 'Nuevo Curso'}"></h5>
                </div>

                <form th:action="@{/admin/cursos/guardar}" th:object="${curso}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{id}">

                    <div class="modal-body">
                        <div class="row g-3">

                            <div class="col-12">
                                <label class="form-label">Título del curso *</label>
                                <input type="text" th:field="*{titulo}" class="form-control"
                                       placeholder="Ej: Álgebra Aplicada I" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Descripción</label>
                                <textarea th:field="*{descripcion}" class="form-control" rows="3"
                                          placeholder="Breve descripción del curso"></textarea>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Área curricular</label>
                                <select th:field="*{areaCurricular}" class="form-select">
                                    <option value="Comunicación">Comunicación</option>
                                    <option value="Matemática">Matemática</option>
                                    <option value="Ciencia y Tecnología">Ciencia y Tecnología</option>
                                    <option value="Inglés">Inglés</option>
                                    <option value="Arte y Cultura">Arte y Cultura</option>
                                    <option value="Ciencias Sociales">Ciencias Sociales</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Duración (horas)</label>
                                <input type="number" th:field="*{duracionHoras}" class="form-control"
                                       placeholder="Ej: 40">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Estado</label>
                                <select th:field="*{estado}" class="form-select">
                                    <option value="ACTIVO">Activo</option>
                                    <option value="BORRADOR">Borrador</option>
                                    <option value="ARCHIVADO">Archivado</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">ID Grado</label>
                                <input type="number" th:field="*{idGrado}" class="form-control"
                                       placeholder="Ej: 1">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">ID Profesor</label>
                                <input type="number" th:field="*{idProfesor}" class="form-control"
                                       placeholder="Ej: 2">
                            </div>

                            <div class="col-12">
                                <label class="form-label">URL Imagen (opcional)</label>
                                <input type="text" th:field="*{imagenUrl}" class="form-control"
                                       placeholder="https://...">
                            </div>

                        </div>
                    </div>

                    <div class="modal-footer">
                        <a th:href="@{/admin/cursos}" class="btn-modal-secondary">Cancelar</a>
                        <button type="submit" class="btn-modal-primary">
                            <i class="fas fa-save"></i> Guardar curso
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.sidebar .nav-link').forEach(link => {
            link.addEventListener('click', function() {
                if (window.innerWidth < 992) {
                    document.getElementById('sidebar').classList.remove('open');
                }
            });
        });
    </script>

</body>
</html>
