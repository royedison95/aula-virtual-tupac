<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - IE Tupac Amaru II</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            color: #333;
        }
        .recovery-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 20px;
        }
        .title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 30px;
        }
        .divider {
            border-top: 1px solid #ddd;
            margin-bottom: 40px;
        }
        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        .input-group-text {
            background-color: #fff;
            border-left: none;
            color: #888;
        }
        .form-control {
            border-right: none;
            box-shadow: none !important;
            font-size: 14px;
        }
        .form-control:focus {
            border-color: #ccc;
        }
        .form-control::placeholder {
            color: #aaa;
        }
        .btn-utp {
            background-color: #b3002d; /* Color rojo de la imagen */
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 4px;
            border: none;
            width: 100%;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .btn-utp:hover {
            background-color: #8a0023;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="recovery-container">
            
            <h1 class="title">Crea tu nueva contraseña</h1>
            <p class="subtitle">Por motivos de seguridad, asegúrate de que tu nueva contraseña sea fácil de recordar pero difícil de adivinar.</p>
            
            <div class="divider"></div>

            <!-- Alerta de error (por si el token expiró o hubo un problema) -->
            <div class="alert alert-danger" th:if="${error}" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/cambiar-password}" method="post">
                <!-- Token de seguridad CSRF (Obligatorio) -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <!-- Token de recuperación (Viene oculto desde el enlace del correo) -->
                <input type="hidden" name="token" th:value="${token}" />

                <!-- Nueva Contraseña -->
                <div class="mb-4">
                    <label class="form-label">Nueva Contraseña</label>
                    <div class="input-group">
                        <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    </div>
                </div>

                <!-- Botón Guardar -->
                <button type="submit" class="btn-utp mt-2">Guardar Contraseña</button>
            </form>

        </div>
    </div>

</body>
</html>
