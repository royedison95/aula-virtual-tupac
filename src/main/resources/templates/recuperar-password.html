<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - IE Tupac Amaru II</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            color: #333;
        }
        .recovery-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 20px;
        }
        .title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 30px;
        }
        .divider {
            border-top: 1px solid #ddd;
            margin-bottom: 40px;
        }
        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        .input-group-text {
            background-color: #fff;
            border-left: none;
            color: #888;
        }
        .form-control {
            border-right: none;
            box-shadow: none !important;
            font-size: 14px;
        }
        .form-control:focus {
            border-color: #ccc;
        }
        .form-control::placeholder {
            color: #aaa;
        }
        .helper-text {
            font-size: 11px;
            color: #555;
            margin-top: 8px;
        }
        .helper-text i {
            color: #333;
        }
        .btn-utp {
            background-color: #b3002d; /* Color rojo de la imagen */
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 4px;
            border: none;
            width: 100%;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .btn-utp:hover {
            background-color: #8a0023;
            color: white;
        }
        .btn-back {
            background-color: #b3002d;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 4px;
            border: none;
            width: 100%;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: 0.2s;
        }
        .btn-back:hover {
            background-color: #8a0023;
            color: white;
        }
        .help-link {
            text-align: right;
            font-size: 13px;
            color: #b3002d;
            text-decoration: none;
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="recovery-container">
            
            <h1 class="title">Recuperar contraseña</h1>
            <p class="subtitle">Ingresa tu usuario y DNI. Ten presente que tu cuenta debe haber sido registrado en nuestra base de datos.</p>
            
            <div class="divider"></div>

            <!-- Mensaje de éxito -->
            <div class="alert alert-success" th:if="${mensaje}" role="alert">
                <i class="fas fa-check-circle me-2"></i> <span th:text="${mensaje}"></span>
            </div>
            <!-- Mensaje de error -->
            <div class="alert alert-danger" th:if="${error}" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/recuperar-password}" method="post">
                
                <!-- Token CSRF -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Usuario -->
                <div class="mb-4">
                    <label class="form-label">Usuario</label>
                    <div class="input-group">
                        <input type="text" name="codigoUsuario" class="form-control" placeholder="Ingresa tu usuario" required>
                        <span class="input-group-text"><i class="far fa-user"></i></span>
                    </div>
                    <div class="helper-text">
                        <i class="far fa-question-circle"></i> Ejemplo usuario: U1533148 (no digitar el @utp.edu.pe)
                    </div>
                </div>

                <!-- DNI -->
                <div class="mb-3">
                    <label class="form-label">DNI</label>
                    <div class="input-group">
                        <input type="text" name="dni" class="form-control" placeholder="Ingresa tu DNI" maxlength="8" required>
                        <span class="input-group-text"><i class="far fa-id-card"></i></span>
                    </div>
                </div>

                <a href="#" class="help-link">¿Necesitas ayuda?</a>

                <button type="submit" class="btn-utp">Verificar</button>
                <a th:href="@{/login}" class="btn-back">Volver al inicio</a>

            </form>

        </div>
    </div>

</body>
</html>
